name: Release

# Builds a self-contained Windows x64 build of Pulsebar, packages it as both
# a portable zip and an Inno Setup installer, and attaches both to a GitHub
# Release whenever a version tag (e.g. v1.0.0) is pushed.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # The tag (minus the leading "v") becomes the assembly version, which the
      # update checker and the ChangeLog window both read at runtime. Fail early
      # if ChangeLog.json has no entry for it, since that window would be empty.
      - name: Determine version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $entries = Get-Content Pulsebar/ChangeLog.json -Raw | ConvertFrom-Json
          if (-not ($entries | Where-Object { $_.Version -eq $version })) {
            Write-Error "Pulsebar/ChangeLog.json has no entry for version $version"
            exit 1
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish self-contained build
        run: >
          dotnet publish Pulsebar/Pulsebar.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ env.VERSION }}
          -o publish

      - name: Package release zip
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          Compress-Archive -Path publish\* -DestinationPath "Pulsebar-$version-win-x64.zip"

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:VERSION" installer\Pulsebar.iss

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Pulsebar-*-win-x64.zip
            installer-output/Pulsebar-Setup-*.exe
          generate_release_notes: true
          draft: false
