name: Release

# Builds a self-contained Windows x64 build of Pulsebar, packages it as both
# a portable zip and an Inno Setup installer, and attaches both to a GitHub
# Release whenever a version tag (e.g. v1.0.0) is pushed.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish self-contained build
        run: >
          dotnet publish Pulsebar/Pulsebar.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Package release zip
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          Compress-Archive -Path publish\* -DestinationPath "Pulsebar-$version-win-x64.zip"

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" installer\Pulsebar.iss

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Pulsebar-*-win-x64.zip
            installer-output/Pulsebar-Setup-*.exe
          generate_release_notes: true
          draft: false
